services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
      INTAKE_MODE: ${INTAKE_MODE:-cache}
      JEV_MODEL: ${JEV_MODEL:-jev-1.13-free}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_DATA_MODE: api
        VITE_INTAKE_MODE: ${VITE_INTAKE_MODE:-cache}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
